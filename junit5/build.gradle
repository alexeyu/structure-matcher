description = 'Plain JUnit 5 assertion helpers for structure-matcher: ' +
        'StructAssertions.assertMatches(expected, actual).'

dependencies {
    // core's ObjectMatcher/FeedbackNode appear in this module's public API (the assertion takes a
    // spec and matches with it), so they are exposed transitively.
    api project(':core')
    // The helpers throw opentest4j's AssertionFailedError, carrying expected and actual so the IDE
    // shows a comparison view, which puts it in this module's API. It is JUnit 5's assertion
    // foundation and stays engine-agnostic, so the helpers work under JUnit 5 or 4.
    api 'org.opentest4j:opentest4j:1.3.0'
    // The failure message reuses report's canonical-path extraction (FeedbackQuery/BrokenLeaf)
    // internally; no report type appears in this module's public API.
    implementation project(':report')
}
