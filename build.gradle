plugins {
    id 'com.diffplug.spotless' version '6.25.0' apply false
    id 'com.vanniktech.maven.publish' version '0.34.0' apply false
}

ext {
    jacksonVersion = '2.18.1'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.diffplug.spotless'

    // Light-touch formatting: orders imports, removes unused imports, trims trailing
    // whitespace, and enforces a final newline. It leaves wrapping and indentation alone.
    // Run `./gradlew spotlessApply` to fix, `spotlessCheck` to verify (runs in `build`).
    spotless {
        java {
            // Preserve the existing grouping (static, then java, third-party, project),
            // separated by blank lines, rather than collapsing it into one block.
            importOrder('\\#', 'java', 'javax', 'org', 'com', 'nl')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    // Enforce a 100-character line limit. Spotless stays light-touch and never rewraps, so this
    // is a check-only guard: it fails the build rather than fixing the line. Wired into
    // `check`, so it runs as part of `build` / CI. Counts characters, not bytes.
    def maxLineLength = 100
    tasks.register('checkLineLength') {
        group = 'verification'
        description = "Fails if any Java source line exceeds ${maxLineLength} characters."
        def javaSources = sourceSets.collect { it.allJava }
        inputs.files(javaSources)
        doLast {
            def violations = []
            javaSources.each { tree ->
                tree.each { file ->
                    file.eachLine('UTF-8') { line, number ->
                        if (line.length() > maxLineLength) {
                            violations << "${file}:${number}: ${line.length()} chars"
                        }
                    }
                }
            }
            if (!violations.isEmpty()) {
                throw new GradleException("Lines exceeding ${maxLineLength} characters:\n  "
                        + violations.join('\n  '))
            }
        }
    }
    tasks.named('check').configure { dependsOn 'checkLineLength' }
    tasks.named('test').configure { dependsOn 'checkLineLength' }

    // Maven Central groupId. The Java packages stay `nl.alexeyu.structmatcher.*`; only the
    // published coordinate namespace is `io.github.alexeyu` (verified via the GitHub account).
    group = 'io.github.alexeyu'
    version = '2.0'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // Enforce the 'reference' doclint group (broken @see/@link targets, wrong @param
    // names) so those can't regress. The other groups (html/syntax/missing) still have
    // legacy issues, so they remain disabled for now.
    javadoc {
        options.addStringOption('Xdoclint:reference', '-quiet')
    }

    dependencies {
        // JUnit 5 (Jupiter). The suite was fully migrated off JUnit 4, so no Vintage engine.
        testImplementation platform('org.junit:junit-bom:5.11.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}

// Publishing to Maven Central (Central Portal). The runnable `examples` demo and the consumer-side
// `e2e-test` verification module are not published. The vanniktech plugin builds sources/javadoc
// every publication, and uploads a bundle to the Central Portal. Artifacts are published as
// `io.github.alexeyu:structure-matcher-<module>:<version>`; inter-module `project(...)`
// dependencies are rewritten to those coordinates automatically.
configure(subprojects.findAll { it.name !in ['examples', 'e2e-test'] }) {
    apply plugin: 'com.vanniktech.maven.publish'

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()

        coordinates(group.toString(), "structure-matcher-${project.name}", version.toString())

        pom {
            name = "Structure matcher :: ${project.name}"
            description = project.description
            url = 'https://github.com/alexeyu/structure-matcher'
            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'alexeyu'
                    name = 'Oleksii Ustenko'
                }
            }
            scm {
                connection = 'scm:git:git://github.com/alexeyu/structure-matcher.git'
                developerConnection = 'scm:git:ssh://git@github.com/alexeyu/structure-matcher.git'
                url = 'https://github.com/alexeyu/structure-matcher'
            }
        }
    }
}
