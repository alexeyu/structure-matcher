# mavenCentralPublishing registers the Central Portal publish tasks: remove it and
# `publishToMavenCentral` disappears. build.gradle must not call publishToMavenCentral()
# as well, since the second call fails on an already-finalized property.
# SONATYPE_AUTOMATIC_RELEASE uploads as AUTOMATIC instead of USER_MANAGED, so you skip
# the manual Publish click in the portal.
mavenCentralPublishing=true
SONATYPE_AUTOMATIC_RELEASE=true
