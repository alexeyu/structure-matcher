description = 'Compare two complex Java objects property by property and get a per-field ' +
        'feedback tree of every difference. Zero runtime dependencies.'

dependencies {
    testImplementation "com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-core:$jacksonVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'com.jayway.jsonpath:json-path:2.9.0'
}

// Lock in the generics cleanup: the main sources compile free of unchecked/rawtypes warnings.
// Erasure survives in two documented @SuppressWarnings("unchecked") casts
// (IndirectMatcher.matchStructures, Matchers.asObjectMatcher). Test sources stay exempt, since
// Mockito generics trip the same warnings, so this guards compileJava alone.
tasks.named('compileJava') {
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:rawtypes' << '-Werror'
}
