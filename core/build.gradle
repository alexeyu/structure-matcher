dependencies {
    testImplementation "com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-core:$jacksonVersion"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'com.jayway.jsonpath:json-path:2.9.0'
}

// Lock in the generics cleanup: the main sources must compile free of unchecked/rawtypes
// warnings. Unavoidable erasure is confined to two documented @SuppressWarnings("unchecked")
// casts (IndirectMatcher.matchStructures, Matchers.asObjectMatcher). Test sources are exempt
// (e.g. Mockito generics), so this guards compileJava only.
tasks.named('compileJava') {
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:rawtypes' << '-Werror'
}
